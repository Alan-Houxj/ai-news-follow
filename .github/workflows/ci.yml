name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - name: 语法检查
        run: python -m py_compile skills/ai-news/scripts/fetch_sources.py skills/ai-news/scripts/make_curated.py skills/ai-news/scripts/run_daily.py
      - name: 依赖导入检查
        run: python -c "import sys; sys.path.insert(0, 'skills/ai-news/scripts'); import fetch_sources, make_curated, run_daily"
